services:
  - type: worker
    name: kino-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: kino-bot-db
          property: connectionString
      - key: ADMIN_IDS
        sync: false
      - key: FORCE_CHANNELS
        sync: false
      - key: SUPPORT_USERNAME
        sync: false

databases:
  - name: kino-bot-db
    plan: free
